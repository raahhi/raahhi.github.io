name: Build and deploy RAAHHI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      indexnow_manifest: ${{ steps.indexnow_manifest.outputs.manifest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh cached exchange rates
        run: node scripts/update-exchange-rates.mjs

      - name: Save latest exchange-rate cache
        run: |
          if ! git diff --quiet -- source/raahhi-tours52.html; then
            git config user.name "RAAHHI exchange-rate updater"
            git config user.email "rates-bot@users.noreply.github.com"
            git add source/raahhi-tours52.html
            git commit -m "Refresh cached USD exchange rates"
            git push origin HEAD:main
          fi

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Build static RAAHHI site
        run: npm run build
        env:
          RAAHHI_URL_BASELINE: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          RAAHHI_INDEXNOW_MANIFEST: ${{ runner.temp }}/indexnow-current.json

      - name: Record IndexNow page fingerprints
        id: indexnow_manifest
        run: printf 'manifest=%s\n' "$(cat "$RUNNER_TEMP/indexnow-current.json")" >> "$GITHUB_OUTPUT"

      - name: Check permanent URL regression cases
        run: node --test scripts/published-urls.test.mjs

      - name: Check responsive pages and early image failures
        run: node .github/check-site-ui.mjs

      - name: Check catalogue search and related suggestions
        run: node .github/check-search.mjs

      - name: Check published catalogue chunks and search
        run: node .github/check-published-data.mjs

      - name: Check prices and currency selection
        run: node .github/check-pricing.mjs

      - name: Check product presentation and enquiry layouts
        run: node .github/check-presentation.mjs

      - name: Check supplier options, cancellation terms and detailed enquiries
        run: node .github/check-options.mjs

      - name: Check enquiry saving and failure recovery
        run: node .github/check-enquiry-delivery.mjs

      - name: Check independent visitor journeys and analytics choices
        run: node .github/check-visitor-activity.mjs

      - name: Check business identity, human enquiry delivery and answer consistency
        run: node .github/check-readiness.mjs

      - name: Check Dubai planning and city category connections
        run: node .github/check-dubai-pilot.mjs

      - name: Check attraction planning and product connections
        run: node .github/check-attraction.mjs

      - name: Check Abu Dhabi and Ras Al Khaimah planning hubs
        run: node .github/check-city-hubs.mjs

      - name: Check independently crawlable catalogue pagination
        run: node .github/check-pagination.mjs

      - name: Check truthful editorial dates and page-type completeness
        run: node .github/check-editorial.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow of published page changes
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the last IndexNow checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-previous.json
          key: indexnow-pages-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-pages-v1-

      - name: Send changes since the last IndexNow checkpoint
        id: notify
        env:
          INDEXNOW_CURRENT: ${{ needs.build.outputs.indexnow_manifest }}
          INDEXNOW_CHECKPOINT: ${{ runner.temp }}/indexnow-previous.json
        run: node scripts/indexnow.mjs

      - name: Save the successful IndexNow checkpoint
        if: steps.notify.outputs.checkpoint_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/indexnow-previous.json
          key: indexnow-pages-v1-${{ github.run_id }}-${{ github.run_attempt }}
