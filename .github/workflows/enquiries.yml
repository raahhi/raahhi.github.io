name: Deploy RAAHHI enquiry backend
on:
  push:
    branches: [main]
    paths: ['workers/**', '.github/workflows/enquiries.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raahhi-enquiry-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Test data validation, storage and dashboard authorization
        run: node --test workers/tests/backend.test.mjs
      - name: Initialize only the new enquiry database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RAAHHI_ENQUIRIES_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RAAHHI_ENQUIRIES_CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.153.0 d1 migrations apply raahhi-enquiries --remote --config workers/enquiries/wrangler.jsonc
      - name: Deploy authenticated dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RAAHHI_ENQUIRIES_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RAAHHI_ENQUIRIES_CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.153.0 deploy --config workers/leads/wrangler.jsonc
      - name: Deploy public enquiry API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RAAHHI_ENQUIRIES_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RAAHHI_ENQUIRIES_CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.153.0 deploy --config workers/enquiries/wrangler.jsonc
      - name: Check public API readiness
        run: |
          node --input-type=module -e "const r=await fetch('https://raahhi-enquiries.asif-772.workers.dev/health');const b=await r.json();if(!r.ok||!b.ready)throw Error('API is not ready; verify DB and TURNSTILE_SECRET');console.log('Enquiry API ready; live forms remain unchanged until separately activated.');"
