name: Validate Pages pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --only-shell chromium
      - run: node --test scripts/published-urls.test.mjs scripts/campaign-attribution.test.mjs scripts/meta-pixel.test.mjs workers/tests/backend.test.mjs
      - run: npm run build
        env:
          RAAHHI_URL_BASELINE: ${{ github.event.pull_request.base.sha }}
          RAAHHI_INDEXNOW_MANIFEST: ${{ runner.temp }}/indexnow-current.json
      - name: Run Pages release checks
        run: |
          for check in site-ui search published-data pricing presentation options enquiry-delivery visitor-activity readiness dubai-pilot attraction city-hubs pagination editorial; do
            node ".github/check-${check}.mjs"
          done
