name: Build and deploy RAAHHI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh cached exchange rates
        run: node scripts/update-exchange-rates.mjs

      - name: Save latest exchange-rate cache
        run: |
          if ! git diff --quiet -- source/raahhi-tours52.html; then
            git config user.name "RAAHHI exchange-rate updater"
            git config user.email "rates-bot@users.noreply.github.com"
            git add source/raahhi-tours52.html
            git commit -m "Refresh cached USD exchange rates"
            git push origin HEAD:main
          fi

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Build static RAAHHI site
        run: npm run build

      - name: Check responsive pages and early image failures
        run: node .github/check-site-ui.mjs

      - name: Check catalogue search and related suggestions
        run: node .github/check-search.mjs

      - name: Check published catalogue chunks and search
        run: node .github/check-published-data.mjs

      - name: Check prices and currency selection
        run: node .github/check-pricing.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
